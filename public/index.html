<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHCET Buddy — Your Academic Advisor</title>
    <meta name="description"
        content="ZHCET Buddy - AI Academic Advisor for Zakir Husain College of Engineering & Technology, AMU">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <span class="brand-icon">🎓</span>
                    <h2>ZHCET Buddy</h2>
                </div>
                <button id="new-chat-btn" class="new-chat-btn">
                    <span>+</span> New Chat
                </button>
            </div>
            <div id="session-list" class="session-list">
                <!-- Session items will be inserted here -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <div class="chat-header">
                <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
                <div class="header-info">
                    <h1>🎓 ZHCET Buddy</h1>
                    <p>Your friendly Academic Advisor — ZHCET, AMU</p>
                </div>
            </div>

            <div id="chat-messages" class="chat-messages">
                <!-- Welcome Screen -->
                <div id="welcome-screen" class="welcome-screen">
                    <div class="welcome-icon">🎓</div>
                    <h2>Hey there! I'm ZHCET Buddy 👋</h2>
                    <p>Your friendly academic advisor for Zakir Husain College of Engineering & Technology. I can help
                        you with courses, rules, grading, and everything ZHCET!</p>
                    <div class="quick-start">
                        <h3>What would you like to know?</h3>
                        <div class="option-chips" id="welcome-chips">
                            <button class="option-chip" data-message="📋 Show me course structures">📋 Course
                                Structures</button>
                            <button class="option-chip" data-message="📖 Tell me about rules and ordinances">📖 Rules &
                                Ordinances</button>
                            <button class="option-chip" data-message="📊 Explain the grading system">📊 Grading
                                System</button>
                            <button class="option-chip" data-message="🏫 Tell me about ZHCET">🏫 About ZHCET</button>
                            <button class="option-chip" data-message="🎓 What are the promotion rules?">🎓 Promotion
                                Rules</button>
                            <button class="option-chip" data-message="📚 Tell me about the library">📚 Library
                                Info</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <form id="chat-form">
                    <input type="text" id="user-input" placeholder="Ask me anything about ZHCET... 💬"
                        autocomplete="off">
                    <button type="submit" id="send-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
